name: Release
# 维护者推送版本标签即确认发布；普通 master push 只跑 CI。
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kirktools/screenshot' && github.event.deleted == false
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 检查 Xcode 与 Swift 工具链
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
      - name: 校验标签与版本
        id: version
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) or os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('标签必须为 vX.Y.Z，并与 VERSION 一致')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'value={version}\n')
          PYTHON
          git merge-base --is-ancestor HEAD origin/master
      - name: 算法测试
        run: swift test
      - name: 构建 universal 应用（ad-hoc 签名，尚未公证）
        env:
          UNIVERSAL: '1'
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          scripts/build-app.sh
          lipo 'dist/Kirk Screenshot.app/Contents/MacOS/KirkScreenshot' -verify_arch arm64
          lipo 'dist/Kirk Screenshot.app/Contents/MacOS/KirkScreenshot' -verify_arch x86_64
          'dist/Kirk Screenshot.app/Contents/MacOS/KirkScreenshot' --self-test
          'dist/Kirk Screenshot.app/Contents/MacOS/KirkScreenshot' --update-network-self-test
          'dist/Kirk Screenshot.app/Contents/MacOS/KirkScreenshot' --scroll-session-self-test
          scripts/test-dmg.sh
          shasum -a 256 dist/*.zip dist/*.dmg > dist/SHA256SUMS.txt
      - name: ZIP 安装版资源与启动回归
        run: python3 scripts/test-packaged-startup.py
      - name: 上传构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.value }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
      - name: 正式发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$VERSION" dist/*.zip dist/*.dmg dist/SHA256SUMS.txt \
            --verify-tag --title "Kirk Screenshot v$VERSION" \
            --notes-file docs/RELEASE-NOTES.md --generate-notes
