name: Release
# 维护者推送版本标签即确认发布；普通 master push 只跑 CI。
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kirktools/screenshot' && github.event.deleted == false
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 公开内容与隐私防回归
        run: |
          python3 scripts/test-public-content.py
          python3 scripts/check-public-content.py
      - name: 检查 Xcode 与 Swift 工具链
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
      - name: 校验标签与版本
        id: version
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) or os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('标签必须为 vX.Y.Z，并与 VERSION 一致')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'value={version}\n')
          PYTHON
          git merge-base --is-ancestor HEAD origin/master
      - name: 算法测试
        run: swift test
      - name: 导入固定发布签名身份
        env:
          MACOS_SIGNING_KEYCHAIN_BASE64: ${{ secrets.MACOS_SIGNING_KEYCHAIN_BASE64 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: python3 scripts/prepare-ci-signing.py
      - name: 构建 universal 应用（固定证书，尚未公证）
        env:
          UNIVERSAL: '1'
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          scripts/build-app.sh
          lipo 'dist/Screenshot.app/Contents/MacOS/Screenshot' -verify_arch arm64
          lipo 'dist/Screenshot.app/Contents/MacOS/Screenshot' -verify_arch x86_64
          'dist/Screenshot.app/Contents/MacOS/Screenshot' --self-test
          'dist/Screenshot.app/Contents/MacOS/Screenshot' --update-network-self-test
          'dist/Screenshot.app/Contents/MacOS/Screenshot' --scroll-session-self-test
          scripts/test-dmg.sh
          # 官网使用固定文件名直链；保留带版本名的原始产物供归档。
          cp "dist/Screenshot-${{ steps.version.outputs.value }}-macOS.dmg" dist/Screenshot-macOS.dmg
          shasum -a 256 dist/*.zip dist/*.dmg > dist/SHA256SUMS.txt
      - name: ZIP 安装版资源与启动回归
        run: python3 scripts/test-packaged-startup.py
      - name: 上传构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.value }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
      - name: 清理临时发布钥匙串
        if: always()
        run: |
          keychain="$RUNNER_TEMP/screenshot-signing/release.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi

  windows:
    if: github.repository == 'kirktools/screenshot' && github.event.deleted == false
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: read

  publish:
    needs: [release, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: 校验两平台产物完整
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          required = [f'Screenshot-{version}-macOS.zip', f'Screenshot-{version}-macOS.dmg', 'Screenshot-macOS.dmg', 'SHA256SUMS.txt']
          for arch in ['x64', 'arm64']:
              required += [f'Screenshot-{version}-Windows-{arch}.zip', f'Screenshot-Windows-{arch}.zip', f'SHA256SUMS-Windows-{arch}.txt']
          if any(not (Path('dist') / name).is_file() for name in required):
              raise SystemExit('平台产物不完整，拒绝发布')
          PYTHON
      - name: 正式发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          gh release create "v$version" dist/*.zip dist/*.dmg dist/SHA256SUMS*.txt \
            --verify-tag --title "Screenshot v$version" \
            --notes-file docs/RELEASE-NOTES.md --generate-notes

  website:
    name: 发布对应版本官网
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
