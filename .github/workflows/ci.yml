name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # 两种架构使用相同 Swift 6 工具链；不依赖 runner 的默认 Xcode。
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 公开内容与隐私防回归
        run: |
          python3 scripts/test-public-content.py
          python3 scripts/check-public-content.py
      - name: 检查 Xcode 与 Swift 工具链
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
      - name: 发布脚本回归（临时本地仓库，不访问 GitHub）
        run: python3 scripts/test-release.py
      - name: 固定签名策略回归（不修改钥匙串）
        run: python3 scripts/test-signing.py
      - name: 本地更新脚本回归（临时假应用）
        run: python3 scripts/test-install-dev.py
      - name: 算法测试
        run: swift test --enable-code-coverage
      # 会话回归以约 30fps 投递帧，必须使用实际分发的优化构建。
      # 未优化的 Intel Debug 会因处理积压丢帧，触发正常的末尾保护确认。
      - name: 构建应用（Release）
        run: scripts/build-app.sh
      - name: ZIP 安装版资源与启动回归
        run: python3 scripts/test-packaged-startup.py
      - name: DMG 挂载与包内容验证
        run: scripts/test-dmg.sh
      - name: 原生渲染与导出测试（不读取桌面）
        run: "'dist/Screenshot.app/Contents/MacOS/Screenshot' --self-test"
      - name: 应用更新回归（模拟网络与临时应用，不安装）
        run: "'dist/Screenshot.app/Contents/MacOS/Screenshot' --update-network-self-test"
      - name: 连续滚动会话回归（合成帧，不读取桌面）
        run: "'dist/Screenshot.app/Contents/MacOS/Screenshot' --scroll-session-self-test"
      - name: 开发版隔离回归（不安装，不读取桌面）
        env:
          SCREENSHOT_VARIANT: development
          SCREENSHOT_SIGNING_MODE: adhoc
          SCREENSHOT_SKIP_PACKAGING: '1'
        run: |
          scripts/build-app.sh
          'dist/Screenshot Dev.app/Contents/MacOS/Screenshot' --packaged-resources-test
          'dist/Screenshot Dev.app/Contents/MacOS/Screenshot' --startup-smoke-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Screenshot-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.dmg
          retention-days: 14
