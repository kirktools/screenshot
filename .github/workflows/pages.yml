name: Website
on:
  # 由正式发布流程调用，使用同一版本标签中的官网源码。
  workflow_call:
  # 仅部署 master 官网，不创建或修改应用 Release。
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/images/editor.png'
      - 'docs/images/screenshot-intro*'
      - 'scripts/*site.py'
      - 'scripts/test-site-download.py'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'github-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 确认仅更新官网的源码与下载
        if: github.event_name == 'workflow_dispatch'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          if os.environ['GITHUB_REF'] != 'refs/heads/master':
              raise SystemExit('仅更新官网必须从 master 运行')
          def api(suffix):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/{suffix}']))
          release = api('releases/latest')
          tag = release['tag_name']
          if release['draft'] or release['prerelease'] or not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('需要已发布的正式版本')
          assets = {asset['name'] for asset in release['assets']}
          if 'Screenshot-macOS.dmg' in assets:
              download = 'https://github.com/kirktools/screenshot/releases/latest/download/Screenshot-macOS.dmg'
          elif f'Screenshot-{tag[1:]}-macOS.dmg' in assets:
              download = f'https://github.com/kirktools/screenshot/releases/download/{tag}/Screenshot-{tag[1:]}-macOS.dmg'
          else:
              raise SystemExit('最新正式版缺少可用的 macOS DMG 下载文件')
          source = api('commits/master')['sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ref={source}\ndownload={download}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'官网模式：仅更新 master 官网\n\n源码：{source}\n\n应用正式版：{tag}\n\n下载：{download}\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.source.outputs.ref || github.sha }}
          persist-credentials: false
      - run: python3 scripts/test-site-download.py
      - run: make site-check
        env:
          SITE_DOWNLOAD_URL: ${{ steps.source.outputs.download }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: .build/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署官网
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
